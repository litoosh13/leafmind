[package]
name = "leafmind-qa"
description = "Answers questions about a document by picking its answer sentence, on device."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["native"]
# The native engine (QaEngine): models on ONNX Runtime, which the app ships; the tokenizer's C regex library.
native = ["dep:ort", "tokenizers/onig"]
# The browser build: no ONNX Runtime (the page runs the models); the tokenizer's pure-Rust regex backend.
# Build with --no-default-features --features wasm.
wasm = ["tokenizers/unstable_wasm", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:js-sys"]

[dependencies]
lingua.workspace = true
ort = { workspace = true, optional = true }
pdf-inspector.workspace = true
regex.workspace = true
tokenizers.workspace = true
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
