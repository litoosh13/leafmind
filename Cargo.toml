[workspace]
resolver = "3"
members = ["crates/leafmind-fields", "crates/leafmind-ocr", "crates/leafmind-qa"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
# Loads the Tesseract library the app ships (leafmind-ocr).
libloading = "0.9"
# Language check, only the languages leafmind supports (each adds its language model to the binary).
lingua = { version = "1.8", default-features = false, features = ["english", "german", "persian", "arabic"] }
# ONNX Runtime bindings; the app ships the ONNX Runtime library and names it (load-dynamic).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "std"] }
pdf-inspector = { version = "=1.24.0", default-features = false }
regex = "1"
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
tract-onnx = "0.23"
wasm-bindgen = "0.2"

# pdf-inspector with leafmind's keep-ZWNJ patch (third_party/pdf-inspector/LEAFMIND_PATCH.md)
[patch.crates-io]
pdf-inspector = { path = "third_party/pdf-inspector" }

[profile.release]
opt-level = 3
